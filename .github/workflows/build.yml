name: "Build Khayel APK - Final Professional Edition"

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          apt-get update
          apt-get install -y wget unzip sed python3 python3-pip
          pip3 install --upgrade gdown --break-system-packages

      - name: Download & Extract Project
        run: |
          rm -rf khayel khayel.zip
          gdown "https://drive.google.com/file/d/1nZ1kDsaIngEVLFH44RQ-BH0QKvu2aJ7g/view?usp=drivesdk" -O khayel.zip
          unzip -qo khayel.zip -d .

      - name: Clean Old Cache
        run: |
          rm -rf khayel/.godot
          rm -rf khayel/android/build

      - name: Disable gdffmpeg on Linux
        run: python3 scripts/fix_gdffmpeg.py

      - name: Verify gdffmpeg removed
        run: |
          if [ -d "khayel/addons/gdffmpeg" ]; then
            echo "FAILED - directory still exists!"
            exit 1
          fi
          echo "OK - gdffmpeg fully removed"

      - name: Fix Project Files
        run: python3 scripts/fix_project.py

      - name: Import Project
        run: |
          godot --headless --path "khayel" --import --quit-after 5000 2>&1 || true
          echo "Import done"

      - name: Install Android Build Template
        run: |
          godot --headless --path "khayel" --install-android-build-template --quit-after 10 2>&1 || true
          echo "=== محتوى المجلد بعد التثبيت ==="
          find khayel/android/build -maxdepth 2 2>/dev/null || echo "المجلد غير موجود"
          test -f khayel/android/build/build.gradle && echo "OK: build.gradle موجود" || echo "سنستخدم الطريقة اليدوية كبديل"

      - name: Manual Template Fallback (if needed)
        run: |
          if [ ! -f "khayel/android/build/build.gradle" ]; then
            echo "تثبيت يدوي احتياطي..."
            TEMPLATE_PATH="/root/.local/share/godot/export_templates/4.7.stable"
            if [ ! -f "$TEMPLATE_PATH/android_source.zip" ]; then
              TEMPLATE_PATH=$(find / -name "android_source.zip" -path "*export_templates*" 2>/dev/null | head -1 | xargs dirname)
            fi
            BUILD_DIR="$(pwd)/khayel/android/build"
            rm -rf "$BUILD_DIR"
            mkdir -p "$BUILD_DIR"
            unzip -qo "$TEMPLATE_PATH/android_source.zip" -d "$BUILD_DIR"
            if [ ! -f "$BUILD_DIR/build.gradle" ]; then
              SUBDIR=$(find "$BUILD_DIR" -maxdepth 3 -name "build.gradle" | head -1 | xargs dirname)
              if [ -n "$SUBDIR" ] && [ "$SUBDIR" != "$BUILD_DIR" ]; then
                shopt -s dotglob
                mv "$SUBDIR"/* "$BUILD_DIR"/
                shopt -u dotglob
              fi
            fi
            find "$BUILD_DIR" -name "project.godot" -delete
            VERSION=$(cat "$TEMPLATE_PATH/version.txt" 2>/dev/null || echo "4.7.stable.official")
            printf "%s" "$VERSION" > "$BUILD_DIR/.build_version"
          fi
          test -f khayel/android/build/build.gradle && echo "OK نهائي: build.gradle موجود" || (echo "فشل نهائي" && exit 1)

      - name: Force Reimport
        run: |
          godot --headless --path "khayel" --import --quit-after 5000 2>&1 || true
          echo "Import done"

      - name: Diagnose
        run: |
          echo "=== android/build contents ==="
          ls -la khayel/android/build/ | head -30
          echo "=== export_presets.cfg ==="
          grep -E "gradle|export_path|keystore|use_gradle" khayel/export_presets.cfg || echo "NOT FOUND"

      - name: Build APK
        run: |
          APK_PATH="$(pwd)/build/android/Khayel_Final.apk"
          mkdir -p "$(dirname $APK_PATH)"
          cd khayel
          test -f "android/build/build.gradle" && echo "EXISTS at export time" || echo "MISSING at export time"
          godot --headless --path "." --export-release "Android" "$APK_PATH" 2>&1 | tee ../build_log.txt
          cd ..

      - name: Verify APK Exists
        run: |
          APK_PATH="$(pwd)/build/android/Khayel_Final.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "APK not found!"
            cat build_log.txt
            exit 1
          else
            echo "APK built successfully!"
            du -sh "$APK_PATH"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Khayel-APK
          path: build/android/Khayel_Final.apk
          retention-days: 7
