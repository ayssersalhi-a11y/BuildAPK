name: "Build Khayel APK - Final Professional Edition"

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ANDROID_HOME: /home/runner/android-sdk
  GODOT_VERSION: 4.7

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk wget unzip sed xvfb \
            libxcursor1 libxinerama1 libxrandr2 libxi6 libgl1 libgbm1 \
            libvulkan1 libfontconfig1 liblzma5 liblzma-dev
          pip install --upgrade gdown

          # بناء liblzma من المصدر وتثبيتها في /usr/local
          wget -q https://github.com/tukaani-project/xz/releases/download/v5.4.6/xz-5.4.6.tar.gz
          tar -xzf xz-5.4.6.tar.gz
          cd xz-5.4.6
          ./configure --prefix=/usr/local
          make -j$(nproc)
          sudo make install
          sudo ldconfig /usr/local/lib
          cd ..
          rm -rf xz-5.4.6 xz-5.4.6.tar.gz

          # إنشاء symlink للمكتبة بالاسم الذي تبحث عنه libgdffmpeg
          sudo ln -sf /usr/local/lib/liblzma.so.5 /usr/lib/x86_64-linux-gnu/liblzma.so.5 || true
          sudo ldconfig

          echo "=== التحقق من lzma_stream_decoder ==="
          nm -D /usr/local/lib/liblzma.so | grep lzma_stream_decoder || echo "غير موجود في /usr/local"
          nm -D /usr/lib/x86_64-linux-gnu/liblzma.so.5 | grep lzma_stream_decoder || echo "غير موجود في /usr/lib"

      - name: Download & Extract Project
        run: |
          rm -rf khayel khayel.zip
          gdown "https://drive.google.com/file/d/1De6AfzdTZe6pKdq2S9qYEXljcubCRtox/view?usp=drivesdk" -O khayel.zip
          unzip -qo khayel.zip -d .

      - name: Clean Old Cache
        run: |
          rm -rf khayel/.godot
          rm -rf khayel/android/build

      - name: Fix libgdffmpeg lzma dependency
        run: |
          LIB="khayel/addons/gdffmpeg/bin/libgdffmpeg.linux.x86_64.so"
          chmod +x "$LIB"

          echo "=== المكتبات المطلوبة من libgdffmpeg ==="
          ldd "$LIB" || true
          echo "=== رموز lzma المطلوبة ==="
          nm -D "$LIB" | grep -i lzma || echo "لا توجد رموز lzma"

          # تأكد أن liblzma متاحة في مسارات البحث
          echo "/usr/local/lib" | sudo tee /etc/ld.so.conf.d/local.conf
          sudo ldconfig

          # إذا كانت المكتبة تبحث عن liblzma.so.5 تحديداً
          LZMA_LIB=$(find /usr -name "liblzma.so*" 2>/dev/null | head -1)
          echo "=== مسار liblzma الموجود: $LZMA_LIB ==="

          # إنشاء symlinks لضمان الوصول
          sudo ln -sf "$LZMA_LIB" /usr/lib/liblzma.so.5 2>/dev/null || true
          sudo ln -sf "$LZMA_LIB" /usr/lib/x86_64-linux-gnu/liblzma.so.5 2>/dev/null || true
          sudo ldconfig

          echo "=== التحقق النهائي ==="
          ldconfig -p | grep lzma

      - name: Fix Project Files
        run: |
          # === نقل plugins من addons إلى android/plugins ===
          if [ -d "khayel/addons/plugins" ]; then
            mkdir -p khayel/android/plugins
            cp -r khayel/addons/plugins/* khayel/android/plugins/
            echo "✅ Plugins copied:"
            ls khayel/android/plugins/
          else
            echo "⚠️ لا يوجد مجلد addons/plugins"
          fi

          # === تفعيل LamoushiAds في export_presets.cfg ===
          if grep -q "plugins/LamoushiAds" khayel/export_presets.cfg; then
            sed -i 's|plugins/LamoushiAds=.*|plugins/LamoushiAds=true|' khayel/export_presets.cfg
          else
            sed -i '/\[preset\.0\.options\]/a plugins/LamoushiAds=true' khayel/export_presets.cfg
          fi

          # === ETC2/ASTC ===
          if grep -q "import_etc2_astc" khayel/project.godot; then
            sed -i 's/import_etc2_astc=false/import_etc2_astc=true/' khayel/project.godot
          else
            printf '\n[rendering]\n\ntextures/vram_compression/import_etc2_astc=true\n' >> khayel/project.godot
          fi

          # === export_presets.cfg ===
          APK_PATH="/home/runner/work/$(basename $GITHUB_REPOSITORY)/$(basename $GITHUB_REPOSITORY)/build/android/Khayel_Final.apk"
          KEYSTORE_PATH="$(pwd)/khayel/script/lamoushi.keystore.jks"
          mkdir -p "$(dirname $APK_PATH)"

          sed -i 's|export_path=.*|export_path="'"$APK_PATH"'"|' khayel/export_presets.cfg
          sed -i 's|custom_template/debug=.*|custom_template/debug=""|' khayel/export_presets.cfg
          sed -i 's|custom_template/release=.*|custom_template/release=""|' khayel/export_presets.cfg

          cat >> khayel/export_presets.cfg << EOF

          keystore/debug="$KEYSTORE_PATH"
          keystore/debug_user="lamoushi_key"
          keystore/debug_password="24ay58s.s24er58"
          keystore/release="$KEYSTORE_PATH"
          keystore/release_user="lamoushi_key"
          keystore/release_password="24ay58s.s24er58"
          EOF

          echo "====== plugins line ======"
          grep -i "plugin" khayel/export_presets.cfg || echo "لا يوجد"
          echo "====== keystore lines ======"
          grep -i "keystore" khayel/export_presets.cfg
          echo "====== export_path ======"
          grep "export_path" khayel/export_presets.cfg
          echo "====== Keystore exists? ======"
          ls -lh "$KEYSTORE_PATH" || echo "❌ KEYSTORE NOT FOUND!"

      - name: Setup Godot Engine & Templates
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -qo Godot_v4.7-stable_linux.x86_64.zip
          mv Godot_v4.7-stable_linux.x86_64 godot
          chmod +x godot

          TEMPLATE_PATH="$HOME/.local/share/godot/export_templates/4.7.stable"
          mkdir -p "$TEMPLATE_PATH"
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz
          unzip -qo Godot_v4.7-stable_export_templates.tpz
          mv templates/* "$TEMPLATE_PATH/"

          echo "=== محتوى مجلد export_templates ==="
          ls "$TEMPLATE_PATH/" | head -20

      - name: Setup Android Environment
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest

          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root=$ANDROID_HOME \
            "platform-tools" \
            "build-tools;34.0.0"

          for i in 1 2 3; do
            echo "Attempt $i: Installing platforms;android-34"
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
              --sdk_root=$ANDROID_HOME \
              "platforms;android-34" && break || sleep 5
          done

          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root=$ANDROID_HOME --licenses

          KEYSTORE_PATH="$(pwd)/khayel/script/lamoushi.keystore.jks"
          mkdir -p ~/.config/godot
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/sdk_path = "%s"\nexport/android/debug_keystore = "%s"\nexport/android/debug_keystore_user = "lamoushi_key"\nexport/android/debug_keystore_pass = "24ay58s.s24er58"\n' \
            "$ANDROID_HOME" "$KEYSTORE_PATH" > ~/.config/godot/editor_settings-4.tres

      - name: Install Android Build Template
        run: |
          # ========================================================
          # الإصلاح الرئيسي: تثبيت android_source في المسار الصحيح
          # ========================================================
          TEMPLATE_PATH="$HOME/.local/share/godot/export_templates/4.7.stable"
          
          # تأكد أن android_source.zip موجود في templates
          echo "=== محتوى export_templates ==="
          ls "$TEMPLATE_PATH/" | grep android || echo "لا يوجد ملف android!"

          mkdir -p khayel/android/build

          cp "$TEMPLATE_PATH/android_source.zip" khayel/android/build/

          cd khayel/android/build
          unzip -qo android_source.zip
          rm android_source.zip

          # حذف أي project.godot داخل الـ template
          find . -name "project.godot" -delete

          # ======================================================
          # الإصلاح الجوهري: كتابة .build_version بشكل صحيح
          # ======================================================
          printf '4.7.stable' > .build_version

          echo "=== التحقق من .build_version ==="
          cat .build_version
          echo ""
          xxd .build_version | head -3

          echo "=== محتوى android/build ==="
          ls -la | head -20

      - name: Force Reimport
        run: |
          xvfb-run ./godot --headless --path "khayel" --import || true
          echo "✅ Import done"

      - name: Build APK
        run: |
          APK_PATH="/home/runner/work/$(basename $GITHUB_REPOSITORY)/$(basename $GITHUB_REPOSITORY)/build/android/Khayel_Final.apk"
          mkdir -p "$(dirname $APK_PATH)"

          # تصدير مع preload المكتبة liblzma
          LD_PRELOAD=/usr/local/lib/liblzma.so.5 xvfb-run ./godot --headless --path "khayel" \
            --export-release "Android" "$APK_PATH" 2>&1 | tee build_log.txt

          # إذا فشل الـ preload جرب بدونه
          if [ ! -f "$APK_PATH" ]; then
            echo "⚠️ المحاولة الأولى فشلت، جرب بدون LD_PRELOAD..."
            xvfb-run ./godot --headless --path "khayel" \
              --export-release "Android" "$APK_PATH" 2>&1 | tee -a build_log.txt
          fi

      - name: Verify APK Exists
        run: |
          APK_PATH="/home/runner/work/$(basename $GITHUB_REPOSITORY)/$(basename $GITHUB_REPOSITORY)/build/android/Khayel_Final.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "❌ APK not found!"
            echo "=== آخر 50 سطر من build_log ==="
            tail -50 build_log.txt || true
            exit 1
          else
            echo "✅ APK built successfully!"
            du -sh "$APK_PATH"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Khayel-APK
          path: build/android/Khayel_Final.apk
          retention-days: 7
