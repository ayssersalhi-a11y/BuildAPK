name: "Test Drive Download Only"

on:
  workflow_dispatch: # تشغيل يدوي فقط لغرض الاختبار

jobs:
  test_download:
    runs-on: ubuntu-latest

    steps:
      - name: Attempt Advanced Download
        run: |
          FILE_ID="1WqPJVISx4dlJtZHERoZQ1m_J1MyXbR7x"
          
          echo "1. جلب كود التأكيد..."
          # محاولة جلب كود التأكيد (Confirm Code)
          CONFIRM=$(wget --quiet --save-cookies /tmp/cookies.txt --keep-session-cookies --no-check-certificate "https://docs.google.com/uc?export=download&id=$FILE_ID" -O- | sed -rn 's/.*confirm=([0-9A-Za-z_]+).*/\1\n/p')
          
          echo "2. الكود المستخرج: [$CONFIRM]"
          
          echo "3. بدء التحميل الفعلي..."
          wget --load-cookies /tmp/cookies.txt "https://docs.google.com/uc?export=download&confirm=$CONFIRM&id=$FILE_ID" -O khayel.zip
          
          echo "4. فحص الملف الناتج..."
          ls -lh khayel.zip
          file khayel.zip
          
          echo "5. عرض أول 100 حرف من الملف (للتأكد إذا كان HTML أم لا):"
          head -c 100 khayel.zip
          
          echo -e "\n6. محاولة فك الضغط التجريبية:"
          if unzip -t khayel.zip; then
            echo "✅ الملف سليم تماماً ويمكن فكه."
          else
            echo "❌ الملف تالف أو ليس ZIP حقيقي."
          fi
