name: "Build Khayel APK - Final Professional Edition"

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ANDROID_HOME: /home/runner/android-sdk
  GODOT_VERSION: 4.7

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk wget unzip sed xvfb \
            libxcursor1 libxinerama1 libxrandr2 libxi6 libgl1 libgbm1 \
            libvulkan1 libfontconfig1 liblzma-dev
          pip install --upgrade gdown

      - name: Download & Extract Project
        run: |
          rm -rf khayel khayel.zip
          gdown "https://drive.google.com/file/d/1zGxsAXft1LwJgwarrnCe8fv3bMHbg03D/view?usp=drivesdk" -O khayel.zip
          unzip -qo khayel.zip -d .

      - name: Clean Old Cache
        run: |
          rm -rf khayel/.godot

      - name: Fix Project Files
        run: |
          # === 1. gdffmpeg.gdextension: نتركه كما هو ===
          chmod +x khayel/addons/gdffmpeg/bin/*.so

          # === 2. project.godot: نضيف ETC2/ASTC فقط ===
          if grep -q "import_etc2_astc" khayel/project.godot; then
            sed -i 's/import_etc2_astc=false/import_etc2_astc=true/' khayel/project.godot
          else
            printf '\n[rendering]\n\ntextures/vram_compression/import_etc2_astc=true\n' >> khayel/project.godot
          fi

          # === 3. export_presets.cfg: نغير المسارات فقط ===
          APK_PATH="/home/runner/work/$(basename $GITHUB_REPOSITORY)/$(basename $GITHUB_REPOSITORY)/build/android/Khayel_Final.apk"
          KEYSTORE_PATH="$(pwd)/khayel/script/lamoushi_keystore.jks"
          mkdir -p "$(dirname $APK_PATH)"

          sed -i 's|export_path=.*|export_path="'"$APK_PATH"'"|' khayel/export_presets.cfg
          sed -i 's|keystore/debug=.*|keystore/debug="'"$KEYSTORE_PATH"'"|' khayel/export_presets.cfg
          sed -i 's|keystore/debug_password=.*|keystore/debug_password="24ay58s.s24er58"|' khayel/export_presets.cfg
          sed -i 's|keystore/debug_user=.*|keystore/debug_user="lamoushi_key"|' khayel/export_presets.cfg
          sed -i 's|keystore/release=.*|keystore/release="'"$KEYSTORE_PATH"'"|' khayel/export_presets.cfg
          sed -i 's|keystore/release_password=.*|keystore/release_password="24ay58s.s24er58"|' khayel/export_presets.cfg
          sed -i 's|keystore/release_user=.*|keystore/release_user="lamoushi_key"|' khayel/export_presets.cfg

          echo "====== export_path & keystore ======"
          grep -E "export_path|keystore" khayel/export_presets.cfg
          echo "====== ETC2 ======"
          grep -i "etc2\|vram" khayel/project.godot || echo "NOT FOUND"
          echo "====== Keystore file exists? ======"
          ls -lh "$KEYSTORE_PATH" || echo "❌ KEYSTORE NOT FOUND!"

      - name: Setup Godot Engine & Templates
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -qo Godot_v4.7-stable_linux.x86_64.zip
          mv Godot_v4.7-stable_linux.x86_64 godot
          chmod +x godot

          TEMPLATE_PATH="$HOME/.local/share/godot/export_templates/4.7.stable"
          mkdir -p "$TEMPLATE_PATH"
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz
          unzip -qo Godot_v4.7-stable_export_templates.tpz
          mv templates/* "$TEMPLATE_PATH/"

      - name: Setup Android Environment
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest

          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root=$ANDROID_HOME \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34"

          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

          KEYSTORE_PATH="$(pwd)/khayel/script/lamoushi_keystore.jks"
          mkdir -p ~/.config/godot
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/sdk_path = "%s"\nexport/android/debug_keystore = "%s"\nexport/android/debug_keystore_user = "lamoushi_key"\nexport/android/debug_keystore_pass = "24ay58s.s24er58"\n' \
            "$ANDROID_HOME" "$KEYSTORE_PATH" > ~/.config/godot/editor_settings-4.tres

      - name: Force Reimport
        run: |
          xvfb-run ./godot --headless --path "khayel" --import || true
          echo "✅ Import done"

      - name: Build APK
        run: |
          APK_PATH="/home/runner/work/$(basename $GITHUB_REPOSITORY)/$(basename $GITHUB_REPOSITORY)/build/android/Khayel_Final.apk"
          mkdir -p "$(dirname $APK_PATH)"

          xvfb-run ./godot --headless --path "khayel" \
            --export-release "Android" "$APK_PATH"

      - name: Verify APK Exists
        run: |
          APK_PATH="/home/runner/work/$(basename $GITHUB_REPOSITORY)/$(basename $GITHUB_REPOSITORY)/build/android/Khayel_Final.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "❌ APK not found!"
            exit 1
          else
            echo "✅ APK built successfully!"
            du -sh "$APK_PATH"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Khayel-APK
          path: build/android/Khayel_Final.apk
          retention-days: 7
