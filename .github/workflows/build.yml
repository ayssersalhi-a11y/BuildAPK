name: "Build Khayel APK - Final Professional Edition"

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ANDROID_HOME: /home/runner/android-sdk
  GODOT_VERSION: 4.7

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk wget unzip sed xvfb \
            libxcursor1 libxinerama1 libxrandr2 libxi6 libgl1 libgbm1 \
            libvulkan1 libfontconfig1 liblzma5 liblzma-dev
          pip install --upgrade gdown

      - name: Download & Extract Project
        run: |
          rm -rf khayel khayel.zip
          gdown "https://drive.google.com/file/d/1De6AfzdTZe6pKdq2S9qYEXljcubCRtox/view?usp=drivesdk" -O khayel.zip
          unzip -qo khayel.zip -d .

      - name: Clean Old Cache
        run: |
          rm -rf khayel/.godot
          rm -rf khayel/android/build

      - name: Disable gdffmpeg on Linux (not needed for Android build)
        run: |
          # gdffmpeg تسبب crash على Linux لكنها غير مطلوبة لبناء APK
          # نعطلها بتعديل ملف gdextension ليتجاهلها على Linux
          GDEXT="khayel/addons/gdffmpeg/gdffmpeg.gdextension"
          
          if [ -f "$GDEXT" ]; then
            echo "=== محتوى gdffmpeg.gdextension قبل التعديل ==="
            cat "$GDEXT"
            
            # إزالة سطر linux من ملف gdextension حتى لا يحاول Godot تحميله
            # نبقي فقط android و windows
            python3 << 'PYEOF'
          import re

          path = "khayel/addons/gdffmpeg/gdffmpeg.gdextension"
          with open(path, "r") as f:
              content = f.read()

          # احذف أي سطر يحتوي على linux
          lines = content.splitlines()
          filtered = [l for l in lines if "linux" not in l.lower()]
          result = "\n".join(filtered) + "\n"

          with open(path, "w") as f:
              f.write(result)

          print("=== بعد التعديل ===")
          print(result)
          PYEOF
          else
            echo "⚠️ ملف gdffmpeg.gdextension غير موجود"
          fi

      - name: Fix Project Files
        run: |
          # === نقل plugins ===
          if [ -d "khayel/addons/plugins" ]; then
            mkdir -p khayel/android/plugins
            cp -r khayel/addons/plugins/* khayel/android/plugins/
            echo "✅ Plugins copied"
            ls khayel/android/plugins/
          else
            echo "⚠️ لا يوجد مجلد addons/plugins"
          fi

          # === تفعيل LamoushiAds ===
          if grep -q "plugins/LamoushiAds" khayel/export_presets.cfg; then
            sed -i 's|plugins/LamoushiAds=.*|plugins/LamoushiAds=true|' khayel/export_presets.cfg
          else
            sed -i '/\[preset\.0\.options\]/a plugins/LamoushiAds=true' khayel/export_presets.cfg
          fi

          # === ETC2/ASTC ===
          if grep -q "import_etc2_astc" khayel/project.godot; then
            sed -i 's/import_etc2_astc=false/import_etc2_astc=true/' khayel/project.godot
          else
            printf '\n[rendering]\n\ntextures/vram_compression/import_etc2_astc=true\n' >> khayel/project.godot
          fi

          # === export_presets.cfg ===
          APK_PATH="/home/runner/work/$(basename $GITHUB_REPOSITORY)/$(basename $GITHUB_REPOSITORY)/build/android/Khayel_Final.apk"
          KEYSTORE_PATH="$(pwd)/khayel/script/lamoushi.keystore.jks"
          mkdir -p "$(dirname $APK_PATH)"

          sed -i 's|export_path=.*|export_path="'"$APK_PATH"'"|' khayel/export_presets.cfg
          sed -i 's|custom_template/debug=.*|custom_template/debug=""|' khayel/export_presets.cfg
          sed -i 's|custom_template/release=.*|custom_template/release=""|' khayel/export_presets.cfg

          cat >> khayel/export_presets.cfg << EOF

          keystore/debug="$KEYSTORE_PATH"
          keystore/debug_user="lamoushi_key"
          keystore/debug_password="24ay58s.s24er58"
          keystore/release="$KEYSTORE_PATH"
          keystore/release_user="lamoushi_key"
          keystore/release_password="24ay58s.s24er58"
          EOF

          echo "====== export_path ======"
          grep "export_path" khayel/export_presets.cfg
          echo "====== keystore ======"
          grep -i "keystore" khayel/export_presets.cfg
          echo "====== Keystore exists? ======"
          ls -lh "$KEYSTORE_PATH" || echo "❌ KEYSTORE NOT FOUND!"

      - name: Setup Godot Engine & Templates
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -qo Godot_v4.7-stable_linux.x86_64.zip
          mv Godot_v4.7-stable_linux.x86_64 godot
          chmod +x godot

          TEMPLATE_PATH="$HOME/.local/share/godot/export_templates/4.7.stable"
          mkdir -p "$TEMPLATE_PATH"
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz
          unzip -qo Godot_v4.7-stable_export_templates.tpz
          mv templates/* "$TEMPLATE_PATH/"

          echo "=== android_source.zip موجود؟ ==="
          ls -lh "$TEMPLATE_PATH/android_source.zip" || echo "❌ غير موجود!"

      - name: Setup Android Environment
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest

          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root=$ANDROID_HOME \
            "platform-tools" \
            "build-tools;34.0.0"

          for i in 1 2 3; do
            echo "Attempt $i: Installing platforms;android-34"
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
              --sdk_root=$ANDROID_HOME \
              "platforms;android-34" && break || sleep 5
          done

          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root=$ANDROID_HOME --licenses

          KEYSTORE_PATH="$(pwd)/khayel/script/lamoushi.keystore.jks"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres << EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$KEYSTORE_PATH"
          export/android/debug_keystore_user = "lamoushi_key"
          export/android/debug_keystore_pass = "24ay58s.s24er58"
          EOF

      - name: Install Android Build Template
        run: |
          TEMPLATE_PATH="$HOME/.local/share/godot/export_templates/4.7.stable"
          BUILD_DIR="khayel/android/build"

          mkdir -p "$BUILD_DIR"

          # فك ضغط android_source.zip
          cp "$TEMPLATE_PATH/android_source.zip" "$BUILD_DIR/"
          cd "$BUILD_DIR"
          unzip -qo android_source.zip
          rm android_source.zip

          # حذف project.godot داخل الـ template
          find . -name "project.godot" -delete

          # =====================================================
          # الإصلاح الجوهري لـ "no version info":
          # Godot يقرأ هذا الملف للتحقق من التوافق
          # يجب أن يكون بدون newline وبالضبط "4.7.stable"
          # =====================================================
          printf '%s' '4.7.stable' > .build_version

          echo "=== التحقق من .build_version ==="
          echo "المحتوى: $(cat .build_version)"
          echo "الحجم: $(wc -c < .build_version) bytes"
          echo "Hex:"
          xxd .build_version

          echo "=== هيكل android/build ==="
          ls -la

      - name: Force Reimport
        run: |
          xvfb-run ./godot --headless --path "khayel" --import 2>&1 || true
          echo "✅ Import done"

      - name: Build APK
        run: |
          APK_PATH="/home/runner/work/$(basename $GITHUB_REPOSITORY)/$(basename $GITHUB_REPOSITORY)/build/android/Khayel_Final.apk"
          mkdir -p "$(dirname $APK_PATH)"

          xvfb-run ./godot --headless --path "khayel" \
            --export-release "Android" "$APK_PATH" 2>&1 | tee build_log.txt

      - name: Verify APK Exists
        run: |
          APK_PATH="/home/runner/work/$(basename $GITHUB_REPOSITORY)/$(basename $GITHUB_REPOSITORY)/build/android/Khayel_Final.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "❌ APK not found!"
            echo "=== build_log كامل ==="
            cat build_log.txt
            exit 1
          else
            echo "✅ APK built successfully!"
            du -sh "$APK_PATH"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Khayel-APK
          path: build/android/Khayel_Final.apk
          retention-days: 7
