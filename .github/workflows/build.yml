name: "Build Khayel APK - Final Professional Edition"

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ANDROID_HOME: /home/runner/android-sdk
  GODOT_VERSION: 4.7

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk wget unzip sed xvfb \
            libxcursor1 libxinerama1 libxrandr2 libxi6 libgl1 libgbm1 \
            libvulkan1 libfontconfig1 liblzma5 liblzma-dev
          pip install --upgrade gdown

      - name: Download & Extract Project
        run: |
          rm -rf khayel khayel.zip
          gdown "https://drive.google.com/file/d/1De6AfzdTZe6pKdq2S9qYEXljcubCRtox/view?usp=drivesdk" -O khayel.zip
          unzip -qo khayel.zip -d .

      - name: Clean Old Cache
        run: |
          rm -rf khayel/.godot
          rm -rf khayel/android/build

      - name: Disable gdffmpeg on Linux
        run: python3 scripts/fix_gdffmpeg.py

      - name: Fix Project Files
        run: python3 scripts/fix_project.py

      - name: Setup Godot Engine & Templates
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -qo Godot_v4.7-stable_linux.x86_64.zip
          mv Godot_v4.7-stable_linux.x86_64 godot
          chmod +x godot
          TEMPLATE_PATH="$HOME/.local/share/godot/export_templates/4.7.stable"
          mkdir -p "$TEMPLATE_PATH"
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz
          unzip -qo Godot_v4.7-stable_export_templates.tpz
          mv templates/* "$TEMPLATE_PATH/"
          ls -lh "$TEMPLATE_PATH/android_source.zip" || echo "NOT FOUND"

      - name: Install Android SDK
        run: |
          mkdir -p /home/runner/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip -d /home/runner/android-sdk/cmdline-tools
          mv /home/runner/android-sdk/cmdline-tools/cmdline-tools /home/runner/android-sdk/cmdline-tools/latest

          yes | /home/runner/android-sdk/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root=/home/runner/android-sdk \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34"

          yes | /home/runner/android-sdk/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root=/home/runner/android-sdk --licenses

          echo "=== SDK تم تثبيته ==="
          ls /home/runner/android-sdk/

      - name: Setup Android Environment
        run: python3 scripts/setup_android.py

      - name: Force Reimport
        run: |
          xvfb-run ./godot --headless --path "khayel" --import 2>&1 || true
          echo "Import done"

      - name: Install Android Build Template
        run: python3 scripts/install_template.py

      - name: Verify build_version
        run: |
          FILE="$(pwd)/khayel/android/build/.build_version"
          cat "$FILE"
          wc -c "$FILE"


      - name: Diagnose
        run: |
          echo "=== كل ملفات .build_version ==="
          find / -name ".build_version" 2>/dev/null

          echo "=== محتوى android/build ==="
          ls -la khayel/android/build/

          echo "=== هل يوجد android/build داخل .godot ==="
          find khayel/.godot -name ".build_version" 2>/dev/null || echo "لا يوجد"

          echo "=== Godot source: أين يبحث؟ ==="
          strings ./godot | grep build_version || echo "لا يوجد في binary"      - name: Build APK
        run: |
          APK_PATH="/home/runner/work/$(basename $GITHUB_REPOSITORY)/$(basename $GITHUB_REPOSITORY)/build/android/Khayel_Final.apk"
          mkdir -p "$(dirname $APK_PATH)"
          xvfb-run ./godot --headless --path "$(pwd)/khayel" \
            --export-release "Android" "$APK_PATH" 2>&1 | tee build_log.txt

      - name: Verify APK Exists
        run: |
          APK_PATH="/home/runner/work/$(basename $GITHUB_REPOSITORY)/$(basename $GITHUB_REPOSITORY)/build/android/Khayel_Final.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "APK not found!"
            cat build_log.txt
            exit 1
          else
            echo "APK built successfully!"
            du -sh "$APK_PATH"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Khayel-APK
          path: build/android/Khayel_Final.apk
          retention-days: 7
