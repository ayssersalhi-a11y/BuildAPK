Name: "Build Khayel APK - professional Power Edition"

on:
  push: 
    branches:
      - main
  workflow_dispatch: 

env:
  ANDROID_HOME: /home/runner/android-sdk
  GODOT_VERSION: 4.6.2

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Professional Dependencies (Modern Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk wget unzip sed xvfb libxcursor1 libxinerama1 libxrandr2 libxi6 libgl1 libgbm1 libvulkan1 libfontconfig1
          pip install --upgrade gdown

      - name: Cache Management
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}
            ~/.local/share/godot/export_templates
            ./godot
          key: ${{ runner.os }}-pro-build-${{ env.GODOT_VERSION }}-v4

      - name: Setup Android SDK
        run: |
          if [ ! -d "$ANDROID_HOME/cmdline-tools" ]; then
            mkdir -p $ANDROID_HOME/cmdline-tools
            cd $ANDROID_HOME/cmdline-tools
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q commandlinetools-linux-11076708_latest.zip
            mv cmdline-tools latest
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "build-tools;34.0.0" "platforms;android-34"
          fi

      - name: Download & Extract Project
        run: |
          rm -rf khayel khayel.zip
          gdown "https://drive.google.com/uc?id=1WqPJVISx4dlJtZHERoZQ1m_J1MyXbR7x" -O khayel.zip
          unzip -qo khayel.zip -d .

      - name: Setup Godot Engine & Templates
        run: |
          if [ ! -f "./godot" ]; then
            wget -q https://github.com/godotengine/godot-builds/releases/download/4.6.2-stable/Godot_v4.6.2-stable_linux.x86_64.zip
            unzip -qo Godot_v4.6.2-stable_linux.x86_64.zip
            mv Godot_v4.6.2-stable_linux.x86_64 godot
            chmod +x godot
          fi
          TEMPLATE_PATH="$HOME/.local/share/godot/export_templates/4.6.2.stable"
          if [ ! -d "$TEMPLATE_PATH" ]; then
            mkdir -p "$TEMPLATE_PATH"
            wget -q https://github.com/godotengine/godot-builds/releases/download/4.6.2-stable/Godot_v4.6.2-stable_export_templates.tpz
            unzip -qo Godot_v4.6.2-stable_export_templates.tpz
            mv templates/* "$TEMPLATE_PATH/"
          fi

      - name: Patch Export Presets & Verify GDExtension
        run: |
          PROJECT_ROOT="khayel"
          PRESET_FILE="$PROJECT_ROOT/export_presets.cfg"
          
          # 1. البحث عن ملف التوقيع ونسخه
          KEY_SOURCE=$(find . -maxdepth 2 -name "lamoushi.keystore.jks" | head -n 1)
          if [ -f "$KEY_SOURCE" ]; then
            cp "$KEY_SOURCE" "$PROJECT_ROOT/lamoushi.keystore.jks"
          else
            touch "$PROJECT_ROOT/lamoushi.keystore.jks"
          fi
          ABS_KEY=$(realpath "$PROJECT_ROOT/lamoushi.keystore.jks")

          # 2. تنظيف ملفات الكاش
          find "$PROJECT_ROOT" -name "*.uid" -delete
          find "$PROJECT_ROOT" -name "*.import" -delete

          # 3. تعديل ملف التصدير
          sed -i 's/gradle_build\/min_sdk=""/gradle_build\/min_sdk="24"/g' "$PRESET_FILE"
          sed -i 's/gradle_build\/target_sdk=""/gradle_build\/target_sdk="34"/g' "$PRESET_FILE"
          sed -i "/package\/signed=true/a keystore/debug=\"$ABS_KEY\"\nkeystore/debug_user=\"lamoushi_key\"\nkeystore/debug_password=\"lamoushi2026\"\nkeystore/release=\"$ABS_KEY\"\nkeystore/release_user=\"lamoushi_key\"\nkeystore/release_password=\"lamoushi2026\"" "$PRESET_FILE"
          sed -i 's/architectures\/arm64-v8a=false/architectures\/arm64-v8a=true/g' "$PRESET_FILE"
          sed -i 's|export_path=.*|export_path="../build/android/Khayel_Final.apk"|g' "$PRESET_FILE"

          # 4. التأكد من وجود ملف الإضافة الخاص بك
          GD_EXT_PATH="$PROJECT_ROOT/addons/gdffmpeg/gdffmpeg.gdextension"
          if [ -f "$GD_EXT_PATH" ]; then
            echo "✅ ملف الإضافة موجود ومعد مسبقاً في مشروعك."
          else
            echo "❌ خطأ: لم يتم العثور على ملف gdffmpeg.gdextension في $GD_EXT_PATH"
            exit 1
          fi

      - name: Create Godot Editor Settings
        run: |
          mkdir -p ~/.config/godot
          echo '[gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/sdk_path = "${{ env.ANDROID_HOME }}"
          export/android/android_sdk_path = "${{ env.ANDROID_HOME }}"
          export/android/jdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"' > ~/.config/godot/editor_settings-4.6.tres

      - name: Accept Android Licenses
        run: yes | ${{ env.ANDROID_HOME }}/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Final Build APK (Virtual Desktop Mode)
        run: |
          mkdir -p build/android
          PROJECT_ROOT="khayel"
          rm -rf "$PROJECT_ROOT/.godot"
          
          echo "🔄 استيراد الموارد..."
          xvfb-run ./godot --headless --path "$PROJECT_ROOT" --editor --quit --verbose || true
          
          echo "🚀 التصدير النهائي للأندرويد..."
          xvfb-run ./godot --headless --path "$PROJECT_ROOT" --export-release "Android" build/android/Khayel_Final.apk --verbose

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Khayel-APK-Final
          path: build/android/Khayel_Final.apk
