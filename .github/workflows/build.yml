name: "Build Khayel APK - Final Professional Edition"

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ANDROID_HOME: /home/runner/android-sdk
  GODOT_VERSION: 4.7

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk wget unzip sed xvfb \
            libxcursor1 libxinerama1 libxrandr2 libxi6 libgl1 libgbm1 \
            libvulkan1 libfontconfig1 liblzma-dev
          pip install --upgrade gdown

      - name: Download & Extract Project
        run: |
          rm -rf khayel khayel.zip
          gdown "https://drive.google.com/file/d/1zGxsAXft1LwJgwarrnCe8fv3bMHbg03D/view?usp=drivesdk" -O khayel.zip
          unzip -qo khayel.zip -d .

      - name: Clean Old Configs & Cache
        run: |
          rm -f khayel/export_presets.cfg
          rm -rf khayel/.godot/editor
          rm -rf khayel/.godot/imported
          rm -rf khayel/.godot/global_script_class_cache.cfg

      - name: Fix All Project Files
        run: |
          # === 1. GDExtension بدون linux ===
          printf '[configuration]\nentry_symbol = "gdffmpeg_init"\ncompatibility_minimum = "4.1"\nreloadable = false\n\n[libraries]\nandroid.release.arm64 = "res://addons/gdffmpeg/bin/libgdffmpeg.android.arm64.so"\nandroid.debug.arm64 = "res://addons/gdffmpeg/bin/libgdffmpeg.android.arm64.so"\n' > khayel/addons/gdffmpeg/gdffmpeg.gdextension
          chmod +x khayel/addons/gdffmpeg/bin/*.so

          # === 2. ETC2/ASTC ===
          if grep -q "import_etc2_astc" khayel/project.godot; then
            sed -i 's/rendering\/textures\/vram_compression\/import_etc2_astc=false/rendering\/textures\/vram_compression\/import_etc2_astc=true/' khayel/project.godot
          else
            printf '\n[rendering]\n\ntextures/vram_compression/import_etc2_astc=true\n' >> khayel/project.godot
          fi

          echo "====== gdffmpeg.gdextension ======"
          cat khayel/addons/gdffmpeg/gdffmpeg.gdextension
          echo "====== ETC2 line ======"
          grep -i "etc2\|vram" khayel/project.godot || echo "NOT FOUND"

      - name: Setup Godot Engine & Templates
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -qo Godot_v4.7-stable_linux.x86_64.zip
          mv Godot_v4.7-stable_linux.x86_64 godot
          chmod +x godot

          TEMPLATE_PATH="$HOME/.local/share/godot/export_templates/4.7.stable"
          mkdir -p "$TEMPLATE_PATH"
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz
          unzip -qo Godot_v4.7-stable_export_templates.tpz
          mv templates/* "$TEMPLATE_PATH/"

      - name: Generate Debug Keystore
        run: |
          keytool -genkey -v \
            -keystore khayel-debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Prepare Export Config
        run: |
          KEYSTORE_PATH="$(pwd)/khayel-debug.keystore"
          printf '[preset.0]\n\nname="Android"\nplatform="Android"\nrunnable=true\ndedicated_server=false\ncustom_features=""\nexport_filter="all_resources"\ninclude_filter=""\nexclude_filter=""\nexport_path="../../build/android/Khayel_Final.apk"\n\n[preset.0.options]\n\ngradle_build/use_gradle_build=false\npackage/unique_name="com.khayel.game"\npackage/name="Khayel"\npackage/signed=true\npackage/debug_build=true\narchitectures/arm64-v8a=true\narchitectures/armeabi-v7a=false\narchitectures/x86=false\narchitectures/x86_64=false\nkeystore/debug="%s"\nkeystore/debug_user="androiddebugkey"\nkeystore/debug_password="android"\nkeystore/release="%s"\nkeystore/release_user="androiddebugkey"\nkeystore/release_password="android"\n' "$KEYSTORE_PATH" "$KEYSTORE_PATH" > khayel/export_presets.cfg

          echo "====== export_presets.cfg ======"
          cat khayel/export_presets.cfg

      - name: Setup Android Environment
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest

          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root=$ANDROID_HOME \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34"

          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

          KEYSTORE_PATH="$(pwd)/khayel-debug.keystore"
          mkdir -p ~/.config/godot
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/sdk_path = "%s"\nexport/android/debug_keystore = "%s"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\n' "$ANDROID_HOME" "$KEYSTORE_PATH" > ~/.config/godot/editor_settings-4.tres

      - name: Force Reimport Assets
        run: |
          # نشغل Godot مرة أولى فقط للـ import بدون تصدير
          xvfb-run ./godot --headless --path "khayel" --import || true
          echo "✅ Import done"

      - name: Build APK
        run: |
          mkdir -p build/android
          xvfb-run ./godot --headless --path "khayel" \
            --export-debug "Android" "../../build/android/Khayel_Final.apk"

      - name: Verify APK Exists
        run: |
          if [ ! -f "build/android/Khayel_Final.apk" ]; then
            echo "❌ APK not found! Build failed."
            exit 1
          else
            echo "✅ APK built successfully!"
            du -sh build/android/Khayel_Final.apk
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Khayel-APK
          path: build/android/Khayel_Final.apk
          retention-days: 7
