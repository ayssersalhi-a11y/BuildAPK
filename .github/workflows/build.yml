name: "Build Khayel APK with Cache"

on:
  push: 
    branches:
      - main
  workflow_dispatch: 

env:
  ANDROID_HOME: /home/runner/android-sdk
  GODOT_VERSION: 4.6.2

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install openjdk-17-jdk wget unzip sed -y
          pip install --upgrade gdown

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}
          key: ${{ runner.os }}-android-sdk-v1

      - name: Cache Godot & Templates
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/godot/export_templates
            ./godot
          key: ${{ runner.os }}-godot-${{ env.GODOT_VERSION }}-v1

      - name: Setup Android SDK
        run: |
          if [ ! -d "$ANDROID_HOME/cmdline-tools" ]; then
            mkdir -p $ANDROID_HOME/cmdline-tools
            cd $ANDROID_HOME/cmdline-tools
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q commandlinetools-linux-11076708_latest.zip
            mv cmdline-tools latest
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "build-tools;34.0.0" "platforms;android-34"
          fi

      - name: Download Project from Google Drive
        run: |
          FILE_ID="1WqPJVISx4dlJtZHERoZQ1m_J1MyXbR7x"
          gdown "https://drive.google.com/uc?id=${FILE_ID}" -O khayel.zip
          unzip -qo khayel.zip -d .

      - name: Setup Godot Engine
        run: |
          if [ ! -f "./godot" ]; then
            wget -q https://github.com/godotengine/godot-builds/releases/download/4.6.2-stable/Godot_v4.6.2-stable_linux.x86_64.zip
            unzip -qo Godot_v4.6.2-stable_linux.x86_64.zip
            mv Godot_v4.6.2-stable_linux.x86_64 godot
            chmod +x godot
          fi

      - name: Setup Export Templates
        run: |
          TEMPLATE_PATH="$HOME/.local/share/godot/export_templates/4.6.2.stable"
          if [ ! -d "$TEMPLATE_PATH" ]; then
            mkdir -p "$TEMPLATE_PATH"
            wget -q https://github.com/godotengine/godot-builds/releases/download/4.6.2-stable/Godot_v4.6.2-stable_export_templates.tpz
            unzip -qo Godot_v4.6.2-stable_export_templates.tpz
            mv templates/* "$TEMPLATE_PATH/"
          fi

      - name: Auto-Patch Project Files
        run: |
          PROJECT_ROOT="khayel"
          GD_PATH="$PROJECT_ROOT/addons/gdffmpeg"
          
          # 1. البحث عن المكتبة
          SO_FULL_PATH=$(find "$PROJECT_ROOT" -iname "libgdffmpeg.android.arm64.so" | head -n 1)
          
          if [ ! -z "$SO_FULL_PATH" ]; then
            GODOT_RES_PATH=$(echo "$SO_FULL_PATH" | sed "s|^$PROJECT_ROOT/|res://|")
            echo "✅ المكتبة موجودة في: $GODOT_RES_PATH"
            
            # حذف الـ import القديم لضمان إعادة التعرف على المكتبة
            find "$PROJECT_ROOT" -name "*.import" -iname "*libgdffmpeg*" -delete
            
            # إعطاء صلاحيات الوصول
            chmod 777 "$SO_FULL_PATH"
            chmod -R 777 "$GD_PATH"
          else
            echo "❌ لم نجد المكتبة!"
            exit 1
          fi

          # 2. إنشاء ملف .gdextension بالمسار الصحيح
          cat <<EOF > "$GD_PATH/gdffmpeg.gdextension"
          [configuration]
          entry_symbol = "gdffmpeg_init"
          compatibility_minimum = "4.1"
          [libraries]
          linux.debug.x86_64 = "$GODOT_RES_PATH"
          linux.release.x86_64 = "$GODOT_RES_PATH"
          android.release.arm64 = "$GODOT_RES_PATH"
          android.debug.arm64   = "$GODOT_RES_PATH"
          EOF

          # 3. ربط الـ Keystore وإعدادات التصدير
          KEY_FILE=$(find . -name "lamoushi.keystore.jks" | head -n 1)
          PRESET_FILE="$PROJECT_ROOT/export_presets.cfg"
          if [ -f "$KEY_FILE" ] && [ -f "$PRESET_FILE" ]; then
            ABS_KEY=$(realpath "$KEY_FILE")
            sed -i "s|keystore/debug=.*|keystore/debug=\"$ABS_KEY\"|g" "$PRESET_FILE"
            sed -i 's|keystore/debug_user=.*|keystore/debug_user="lamoushi_key"|g' "$PRESET_FILE"
            sed -i 's|keystore/debug_password=.*|keystore/debug_password="lamoushi2026"|g' "$PRESET_FILE"
            sed -i 's/package\/signed=false/package\/signed=true/g' "$PRESET_FILE"
            sed -i 's/gradle_build\/use_gradle_build=false/gradle_build\/use_gradle_build=true/g' "$PRESET_FILE"
            sed -i 's|export_path=.*|export_path="../build/android/Khayel_Final.apk"|g' "$PRESET_FILE"
          fi

      - name: Create Godot Editor Settings
        run: |
          mkdir -p ~/.config/godot
          echo '[gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/sdk_path = "${{ env.ANDROID_HOME }}"
          export/android/android_sdk_path = "${{ env.ANDROID_HOME }}"
          export/android/jdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"' > ~/.config/godot/editor_settings-4.6.tres

      - name: Final Build APK
        run: |
          mkdir -p build/android
          # تنظيف الكاش لإجبار المحرك على قراءة الترقيعات الجديدة
          rm -rf khayel/.godot
          
          echo "🔄 جاري استيراد الموارد وتحديث المشروع..."
          ./godot --headless --path khayel --editor --quit --verbose || true
          
          echo "🚀 بدء عملية التصدير النهائية..."
          ./godot --headless --path khayel --export-debug "Android" build/android/Khayel_Final.apk --verbose

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Khayel-APK-Package
          path: build/android/Khayel_Final.apk
