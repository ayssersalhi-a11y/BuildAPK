name: "Build Khayel APK - Final Professional Edition"

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ANDROID_HOME: /home/runner/android-sdk
  GODOT_VERSION: 4.7

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk wget unzip sed xvfb \
            libxcursor1 libxinerama1 libxrandr2 libxi6 libgl1 libgbm1 \
            libvulkan1 libfontconfig1 liblzma5 liblzma-dev
          pip install --upgrade gdown

      - name: Download & Extract Project
        run: |
          rm -rf khayel khayel.zip
          gdown "https://drive.google.com/file/d/1nZ1kDsaIngEVLFH44RQ-BH0QKvu2aJ7g/view?usp=drivesdk" -O khayel.zip
          unzip -qo khayel.zip -d .

      - name: Clean Old Cache
        run: |
          rm -rf khayel/.godot
          rm -rf khayel/android/build

      - name: Disable gdffmpeg on Linux
        run: python3 scripts/fix_gdffmpeg.py

      - name: Verify gdffmpeg removed
        run: |
          if [ -d "khayel/addons/gdffmpeg" ]; then
            echo "FAILED - directory still exists!"
            exit 1
          fi
          echo "OK - gdffmpeg fully removed"

      - name: Fix Project Files
        run: python3 scripts/fix_project.py

      - name: Setup Godot Engine & Templates
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -qo Godot_v4.7-stable_linux.x86_64.zip
          mv Godot_v4.7-stable_linux.x86_64 godot
          chmod +x godot
          TEMPLATE_PATH="$HOME/.local/share/godot/export_templates/4.7.stable"
          mkdir -p "$TEMPLATE_PATH"
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz
          unzip -qo Godot_v4.7-stable_export_templates.tpz
          mv templates/* "$TEMPLATE_PATH/"
          ls -lh "$TEMPLATE_PATH/android_source.zip" || echo "NOT FOUND"

      - name: Install Android SDK
        run: |
          mkdir -p /home/runner/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip -d /home/runner/android-sdk/cmdline-tools
          mv /home/runner/android-sdk/cmdline-tools/cmdline-tools /home/runner/android-sdk/cmdline-tools/latest

          yes | /home/runner/android-sdk/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root=/home/runner/android-sdk \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34"

          yes | /home/runner/android-sdk/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root=/home/runner/android-sdk --licenses

          echo "=== SDK installed ==="
          ls /home/runner/android-sdk/

      - name: Setup Android Environment
        run: python3 scripts/setup_android.py

      - name: Install Android Build Template
        run: |
          TEMPLATE_PATH="$HOME/.local/share/godot/export_templates/4.7.stable"
          BUILD_DIR="$(pwd)/khayel/android/build"
          mkdir -p "$BUILD_DIR"

          # تثبيت يدوي مباشر للتيمبليت
          cp "$TEMPLATE_PATH/android_source.zip" "$BUILD_DIR/"
          cd "$BUILD_DIR"
          unzip -qo android_source.zip
          rm android_source.zip

          # احذف أي project.godot داخل التيمبليت
          find . -name "project.godot" -delete
          echo "Deleted stray project.godot files"

          # اكتب .build_version من version.txt الرسمي لتطابق النسخ
          VERSION=$(cat "$TEMPLATE_PATH/version.txt" 2>/dev/null || echo "4.7.stable.official")
          printf "%s" "$VERSION" > .build_version

          # تفعيل علامة جاهزية التيمبليت للمحرك
          touch _was_built
          cd -

          # إصلاح وضبط مسار مجلد الجرادل في ملف export_presets.cfg ليتعرف عليه جودو فوراً
          sed -i 's|gradle_build/gradle_build_directory=""|gradle_build/gradle_build_directory="res://android/build"|g' khayel/export_presets.cfg

          echo "=== Verified Preset Configuration ==="
          grep "gradle_build_directory" khayel/export_presets.cfg



      - name: Check template version match
        run: |
          BUILD_VER=$(cat khayel/android/build/.build_version 2>/dev/null || echo "MISSING")
          TEMPLATE_VER=$(cat ~/.local/share/godot/export_templates/4.7.stable/version.txt 2>/dev/null || echo "NOT FOUND")
          echo "build_version : '$BUILD_VER'"
          echo "template ver  : '$TEMPLATE_VER'"
          if [ "$BUILD_VER" = "MISSING" ]; then
            echo "ERROR: .build_version not created!"
            exit 1
          fi
          if [ "$BUILD_VER" != "$TEMPLATE_VER" ]; then
            echo "MISMATCH - سيسبب فشل البناء"
            exit 1
          fi
          echo "OK - الإصداران متطابقان"

      - name: Force Reimport
        run: |
          xvfb-run ./godot --headless --path "khayel" --import --quit-after 5000 2>&1 || true
          echo "Import done"

      - name: Diagnose
        run: |
          echo "=== editor_settings ==="
          grep android ~/.config/godot/editor_settings-4.7.tres || echo "NOT FOUND"

          echo "=== android/build contents ==="
          ls -la khayel/android/build/ | head -30

          echo "=== export_presets.cfg ==="
          grep -E "gradle|export_path|keystore|use_gradle" khayel/export_presets.cfg || echo "NOT FOUND"

      - name: Build APK
        run: |
          APK_PATH="/home/runner/work/$(basename $GITHUB_REPOSITORY)/$(basename $GITHUB_REPOSITORY)/build/android/Khayel_Final.apk"
          mkdir -p "$(dirname $APK_PATH)"

          cd khayel
          
          # التحقق من استقرار الملفات قبل البناء
          test -f "android/build/build.gradle" && echo "EXISTS at export time" || echo "MISSING at export time"

          # تصدير التطبيق مباشرة مع تحويل المخرجات إلى ملف لوج لمراقبة المعالجة
          xvfb-run ../godot --headless --path "." \
            --export-release "Android" "$APK_PATH" 2>&1 | tee ../build_log.txt
          cd ..



      - name: Verify APK Exists
        run: |
          APK_PATH="/home/runner/work/$(basename $GITHUB_REPOSITORY)/$(basename $GITHUB_REPOSITORY)/build/android/Khayel_Final.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "APK not found!"
            cat build_log.txt
            exit 1
          else
            echo "APK built successfully!"
            du -sh "$APK_PATH"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Khayel-APK
          path: build/android/Khayel_Final.apk
          retention-days: 7
