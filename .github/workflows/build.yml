name: "Build Khayel APK - Final Professional Edition"

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ANDROID_HOME: /home/runner/android-sdk
  GODOT_VERSION: 4.7

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk wget unzip sed xvfb \
            libxcursor1 libxinerama1 libxrandr2 libxi6 libgl1 libgbm1 \
            libvulkan1 libfontconfig1 liblzma-dev
          pip install --upgrade gdown

      - name: Download & Extract Project
        run: |
          rm -rf khayel khayel.zip
          gdown "https://drive.google.com/file/d/1zGxsAXft1LwJgwarrnCe8fv3bMHbg03D/view?usp=drivesdk" -O khayel.zip
          unzip -qo khayel.zip -d .

      - name: Clean Old Configs
        run: |
          rm -f khayel/export_presets.cfg
          rm -rf khayel/.godot/editor

      - name: Disable GDExtension Completely
        run: |
          # الحل الجذري: نعطل الـ extension كلياً حتى لا يحاول Godot تحميله
          cat > khayel/addons/gdffmpeg/gdffmpeg.gdextension << 'EOF'
          [configuration]
          entry_symbol = "gdffmpeg_init"
          compatibility_minimum = "4.1"
          reloadable = false

          [libraries]
          android.release.arm64 = "res://addons/gdffmpeg/bin/libgdffmpeg.android.arm64.so"
          android.debug.arm64   = "res://addons/gdffmpeg/bin/libgdffmpeg.android.arm64.so"

          [dependencies]
          android.release.arm64 = {}
          android.debug.arm64   = {}
          EOF

          chmod +x khayel/addons/gdffmpeg/bin/*.so

      - name: Fix ETC2/ASTC in project.godot
        run: |
          # تفعيل ETC2/ASTC المطلوب لتصدير Android
          if grep -q "rendering/textures/vram_compression" khayel/project.godot; then
            sed -i 's/rendering\/textures\/vram_compression\/import_etc2_astc=.*/rendering\/textures\/vram_compression\/import_etc2_astc=true/' khayel/project.godot
          else
            echo 'rendering/textures/vram_compression/import_etc2_astc=true' >> khayel/project.godot
          fi

          echo "--- project.godot rendering section ---"
          grep -i "etc2\|vram\|compress" khayel/project.godot || echo "No match found"

      - name: Setup Godot Engine & Templates
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -qo Godot_v4.7-stable_linux.x86_64.zip
          mv Godot_v4.7-stable_linux.x86_64 godot
          chmod +x godot

          TEMPLATE_PATH="$HOME/.local/share/godot/export_templates/4.7.stable"
          mkdir -p "$TEMPLATE_PATH"
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz
          unzip -qo Godot_v4.7-stable_export_templates.tpz
          mv templates/* "$TEMPLATE_PATH/"

      - name: Generate Debug Keystore
        run: |
          keytool -genkey -v \
            -keystore khayel-debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Prepare Export Config
        run: |
          PROJECT_ROOT="khayel"
          KEYSTORE_PATH="$(pwd)/khayel-debug.keystore"

          cat > "$PROJECT_ROOT/export_presets.cfg" << EOF
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="../../build/android/Khayel_Final.apk"

          [preset.0.options]

          gradle_build/use_gradle_build=false
          package/unique_name="com.khayel.game"
          package/name="Khayel"
          package/signed=true
          package/debug_build=true
          architectures/arm64-v8a=true
          architectures/armeabi-v7a=false
          architectures/x86=false
          architectures/x86_64=false
          keystore/debug="$KEYSTORE_PATH"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          keystore/release="$KEYSTORE_PATH"
          keystore/release_user="androiddebugkey"
          keystore/release_password="android"
          EOF

      - name: Setup Android Environment
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools

          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest

          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root=$ANDROID_HOME \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34"

          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

          mkdir -p ~/.config/godot
          KEYSTORE_PATH="$(pwd)/khayel-debug.keystore"
          cat > ~/.config/godot/editor_settings-4.tres << EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$KEYSTORE_PATH"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Build APK
        run: |
          mkdir -p build/android

          xvfb-run ./godot --headless --path "khayel" \
            --export-debug "Android" "../../build/android/Khayel_Final.apk"

      - name: Verify APK Exists
        run: |
          if [ ! -f "build/android/Khayel_Final.apk" ]; then
            echo "❌ APK not found! Build failed."
            exit 1
          else
            echo "✅ APK built successfully!"
            du -sh build/android/Khayel_Final.apk
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Khayel-APK
          path: build/android/Khayel_Final.apk
          retention-days: 7
