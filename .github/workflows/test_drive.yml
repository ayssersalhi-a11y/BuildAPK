name: "Auto Test Drive Download"

on:
  push:
    branches:
      - main  # سيشتغل تلقائياً بمجرد ضغط Commit أو Push على فرع main
  workflow_dispatch: # نترك خيار التشغيل اليدوي للطوارئ

jobs:
  test_download:
    runs-on: ubuntu-latest

    steps:
      - name: Attempt Google Drive Download
        run: |
          FILE_ID="1WqPJVISx4dlJtZHERoZQ1m_J1MyXbR7x"
          OUT_FILE="khayel.zip"
          
          echo "🔍 يبدأ الفحص التلقائي لجلب الملف..."
          
          # جلب الصفحة الأولية وحفظ الكوكيز
          wget --quiet --save-cookies /tmp/cookies.txt --keep-session-cookies --no-check-certificate \
            "https://docs.google.com/uc?export=download&id=${FILE_ID}" -O- > /tmp/confirm_page.html
          
          # استخراج الكود باستخدام محرك بحث أكثر دقة
          CONFIRM=$(grep -o 'confirm=[^&\" ]*' /tmp/confirm_page.html | cut -d'=' -f2)
          
          if [ -z "$CONFIRM" ]; then
            echo "⚠️ لم نجد كود تأكيد، نحاول التحميل المباشر..."
            wget --load-cookies /tmp/cookies.txt "https://docs.google.com/uc?export=download&id=${FILE_ID}" -O $OUT_FILE
          else
            echo "✅ تم قنص الكود: $CONFIRM"
            wget --load-cookies /tmp/cookies.txt "https://docs.google.com/uc?export=download&confirm=${CONFIRM}&id=${FILE_ID}" -O $OUT_FILE
          fi

          # التحقق من حجم الملف
          SIZE=$(stat -c%s "$OUT_FILE")
          echo "📊 الحجم المستلم: $SIZE بايت"
          
          if [ "$SIZE" -lt 10000 ]; then
            echo "❌ فشل ذريع! جوجل أرسلت صفحة تحذير بدلاً من الملف."
            echo "--- محتوى الرد من جوجل لغرض التصحيح ---"
            cat $OUT_FILE | head -n 50 # عرض أول 50 سطر لنفهم المشكلة
            echo "--- نهاية المحتوى ---"
            exit 1
          else
            echo "🎉 نجاح! الملف جاهز."
            file $OUT_FILE
            ls -lh $OUT_FILE
          fi
          
          rm -rf /tmp/cookies.txt /tmp/confirm_page.html
