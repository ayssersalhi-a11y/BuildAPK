name: "Auto Test Drive Download"

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test_download:
    runs-on: ubuntu-latest

    steps:
      - name: Attempt Google Drive Download
        run: |
          FILE_ID="1WqPJVISx4dlJtZHERoZQ1m_J1MyXbR7x"
          OUT_FILE="khayel.zip"
          
          echo "🔍 محاولة السحب باستخدام الطريقة المحدثة..."

          # الخطوة 1: الحصول على رابط التأكيد المباشر باستخدام curl
          # نقوم بجلب الرابط الذي يحتوي على كلمة 'confirm' من داخل صفحة التحذير
          CONFIRM=$(curl -sL "https://docs.google.com/uc?export=download&id=${FILE_ID}" | grep -oE 'confirm=[^&" ]+' | head -n 1)
          
          if [ -z "$CONFIRM" ]; then
            echo "⚠️ لم نجد كود تأكيد كالمعتاد، سنجرب طريقة استخراج الرابط الكامل..."
            # محاولة أخرى للحصول على الرابط من زر التحميل
            DOWNLOAD_URL="https://docs.google.com/uc?export=download&${CONFIRM}&id=${FILE_ID}"
          else
            echo "✅ تم العثور على الكود: $CONFIRM"
            DOWNLOAD_URL="https://docs.google.com/uc?export=download&${CONFIRM}&id=${FILE_ID}"
          fi

          # الخطوة 2: التحميل الفعلي
          wget --no-check-certificate "$DOWNLOAD_URL" -O $OUT_FILE

          # التحقق من الحجم
          SIZE=$(stat -c%s "$OUT_FILE")
          echo "📊 الحجم المستلم: $SIZE بايت"
          
          if [ "$SIZE" -lt 10000 ]; then
            echo "❌ لا تزال جوجل ترفض. سننتقل لخطة (ب): استخدام gdown"
            pip install gdown
            gdown --id $FILE_ID -O $OUT_FILE
            
            # فحص الحجم مرة أخرى بعد gdown
            SIZE=$(stat -c%s "$OUT_FILE")
            echo "📊 الحجم بعد gdown: $SIZE بايت"
          fi

          if [ "$SIZE" -gt 10000 ]; then
            echo "🎉 نجاح! الملف تم تحميله."
            ls -lh $OUT_FILE
          else
            echo "❌ حتى gdown فشل. يبدو أن الملف محمي بكلمة سر أو القيود صارمة جداً."
            exit 1
          fi
