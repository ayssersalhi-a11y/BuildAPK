name: "Auto Test Drive Download"

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test_download:
    runs-on: ubuntu-latest

    steps:
      - name: Attempt Google Drive Download
        run: |
          FILE_ID="1WqPJVISx4dlJtZHERoZQ1m_J1MyXbR7x"
          OUT_FILE="khayel.zip"
          
          echo "🔍 محاولة السحب باستخدام gdown..."

          # تثبيت gdown والتأكد من أحدث نسخة
          pip install --upgrade gdown

          # استخدام gdown بالصيغة الجديدة المتوافقة مع جميع الإصدارات
          # نضع الرابط كاملاً لضمان عدم حدوث خطأ في المعرف
          gdown "https://drive.google.com/uc?id=${FILE_ID}" -O $OUT_FILE

          # التحقق من الحجم
          SIZE=$(stat -c%s "$OUT_FILE")
          echo "📊 الحجم المستلم: $SIZE بايت"
          
          if [ "$SIZE" -gt 10000 ]; then
            echo "🎉 مبروك يا لموشي! تم تحميل الملف بنجاح."
            ls -lh $OUT_FILE
            file $OUT_FILE
          else
            echo "❌ لا يزال هناك خطأ في التحميل، الحجم غير منطقي."
            exit 1
          fi
